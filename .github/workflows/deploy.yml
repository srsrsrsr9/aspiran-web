name: Deploy Aspiran to GitHub Pages

# Builds on every push to main, and every morning at 07:15 IST (01:45 UTC) so the free current-affairs pages pick up
# the day's cards from the app server (scripts/pull-content.mjs).
on:
  push:
    branches: [main]
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22.23.4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
